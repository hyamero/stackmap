name: Feature request
description: Suggest a new capability, diagram feature or schema change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to show or do, and why stackmap can't do it today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. For a schema change, a sketch of the JSON helps.
